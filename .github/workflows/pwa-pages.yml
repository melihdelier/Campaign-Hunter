name: PWA katalog ve yayin

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # Türkiye UTC+3: 08:00 ve 18:00
    - cron: '0 5 * * *'
    - cron: '0 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REFRESH_WEBHOOK_URL: ${{ vars.REFRESH_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canli kampanya katalogunu tara
        run: python server/campaign_crawler.py

      - name: PWA statik katalogunu hazirla
        run: |
          mkdir -p web/data
          cp server/data/catalog.json web/data/catalog.json

      - name: Supabase katalog snapshot yayinla
        run: python server/publish_supabase.py

      - name: Runtime PWA ayarlarini yaz
        run: |
          python - <<'PY'
          import json, os, pathlib
          c={
            'supabaseUrl':os.getenv('SUPABASE_URL',''),
            'supabaseAnonKey':os.getenv('SUPABASE_PUBLISHABLE_KEY',''),
            'catalogMode':'auto',
            'refreshWebhookUrl':os.getenv('REFRESH_WEBHOOK_URL','')
          }
          pathlib.Path('web/runtime-config.js').write_text(
              'window.BKA_CONFIG = '+json.dumps(c,ensure_ascii=False)+';\n',
              encoding='utf-8'
          )
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
